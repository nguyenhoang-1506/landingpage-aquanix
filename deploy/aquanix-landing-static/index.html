<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aquanix — Ghi nhật ký ao bằng điện thoại</title>
<link rel="stylesheet" href="./styles.css">
<style>
body{background:var(--surface)}h1,h2,h3{color:var(--ink)}
.wrap{max-width:1120px;margin:0 auto;padding:0 var(--space-5);box-sizing:border-box}
.sec{padding-top:var(--space-8);padding-bottom:var(--space-8)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.feat.rev>*:first-child{order:2}
.hero-h1{font-size:60px;line-height:66px}
.shot{opacity:0;transition:opacity 1.6s ease;transform:scale(1.18);transform-origin:50% 60%}.shot.on{opacity:1;animation:kb 7s ease-out forwards}
@keyframes kb{from{transform:scale(1.18) translateY(-3%)}to{transform:scale(1) translateY(0)}}
@media(prefers-reduced-motion:reduce){.shot.on{animation:none}}
@media(max-width:1000px){.nav{display:none!important}.dot-label{display:none}}
html{scroll-behavior:smooth}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}.feat.rev>*:first-child{order:0}.sec{padding-top:var(--space-7);padding-bottom:var(--space-7)}.hero-h1{font-size:36px;line-height:42px}.dots{display:none!important}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./_ds_bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head><body><template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#0198B3"/><text x="100" y="118" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-weight="700" font-size="44" fill="#fff">Aquanix</text></svg></template><div id="root"></div>
<script type="text/babel" src="./header.jsx"></script>
<script type="text/babel" src="./hero.jsx"></script>
<script type="text/babel" src="./sections.jsx"></script>
<script type="text/babel">
function App(){
  const [sent, setSent] = React.useState(false);
  const goTo = id => () => { const el = document.getElementById(id); if (el) window.scrollTo({ top: el.offsetTop - 72, behavior: 'smooth' }); };
  return <>
    <Header onCta={goTo('download')}/>
    <main data-screen-label="Landing hộ nuôi"><Hero onCta={goTo('download')} onDay={goTo('day')}/><Day/><Sell/><Why/><Voice/><Faq/><Download sent={sent} onSend={() => setSent(true)}/></main>
    <Footer/>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
